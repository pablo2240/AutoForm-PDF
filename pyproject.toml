[project]
name = "smartformai"
version = "1.0.0"
description = "AutoForm PDF: WYSIWYG Form Filler & Progressive Disclosure Data Manager"
authors = [
    {name = "SmartFormAI Team"}
]
dependencies = [
    "PyMuPDF>=1.23.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "openai>=1.40.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
